[project]
name = "servicelens"
version = "0.1.0"
description = "Local-first desktop work order intelligence for maintenance and service operations."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/nickreid524-alt/ServiceLens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["servicelens*"]
